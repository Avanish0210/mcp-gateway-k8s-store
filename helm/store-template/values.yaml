store:
  id: ""
  localPort: 38082

wordpress:
  wordpressUsername: admin
  wordpressEmail: admin@example.com
  wordpressBlogName: MCP Gateway Store
  image:
    # Temporary local-development compatibility with archived Bitnami images.
    repository: bitnamilegacy/wordpress
    tag: 6.8.2-debian-12-r5
  existingSecret: wordpress-credentials
  allowEmptyPassword: false
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
  commonLabels:
    app.kubernetes.io/managed-by: mcp-gateway
  podLabels:
    app.kubernetes.io/managed-by: mcp-gateway
  networkPolicy:
    enabled: false
  mariadb:
    enabled: true
    architecture: standalone
    image:
      repository: bitnamilegacy/mariadb
      tag: 12.0.2-debian-12-r0
    auth:
      database: storedb
      username: storeuser
      existingSecret: mariadb-credentials
    primary:
      # Process probes must not restart a healthy database because an admin
      # credential differs from a restored/legacy volume. WooCommerce API
      # health separately validates real application authentication and reads.
      customStartupProbe:
        tcpSocket:
          port: 3306
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 60
      customLivenessProbe:
        tcpSocket:
          port: 3306
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      customReadinessProbe:
        tcpSocket:
          port: 3306
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      persistence:
        enabled: true
        size: 2Gi
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 768Mi
    networkPolicy:
      enabled: false

resourceQuota:
  requests.cpu: "2"
  requests.memory: 2Gi
  limits.cpu: "3"
  limits.memory: 3Gi
  persistentvolumeclaims: "2"
  requests.storage: 4Gi

limitRange:
  default:
    cpu: 750m
    memory: 768Mi
  defaultRequest:
    cpu: 250m
    memory: 256Mi
