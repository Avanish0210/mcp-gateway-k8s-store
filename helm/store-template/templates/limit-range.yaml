apiVersion: v1
kind: LimitRange
metadata:
  name: managed-store-limits
  labels:
    app.kubernetes.io/managed-by: mcp-gateway
    mcp-gateway/store-id: {{ .Values.store.id | quote }}
spec:
  limits:
    - type: Container
      default: {{ toYaml .Values.limitRange.default | nindent 8 }}
      defaultRequest: {{ toYaml .Values.limitRange.defaultRequest | nindent 8 }}
