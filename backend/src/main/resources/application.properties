spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.port=8081

#DB Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Kube-store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:avanish7080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format-sql=false

# WooCommerce MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC

dashboard.allowed-origin=${DASHBOARD_ALLOWED_ORIGIN:http://localhost:5173}

# Invitation links are only returned when the explicit switch is enabled in a dev/local Spring profile.
team.invitations.expiration-hours=${TEAM_INVITATION_EXPIRATION_HOURS:72}
team.invitations.development-links-enabled=${TEAM_INVITATION_DEV_LINKS_ENABLED:true}
team.invitations.frontend-base-url=${INVITATION_FRONTEND_BASE_URL:http://localhost:5173}

# Stateless JWT authentication. JWT_SECRET must be Base64 for at least 32 random bytes.
security.jwt.secret=${JWT_SECRET:jdshvfjshvfshdfbvkfheurfgsbkejhfirhfshbleihforuihgfsgeihfsdkjfhsieh}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
security.bootstrap.admin-username=${INITIAL_ADMIN_USERNAME:Admin}
security.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:admin7080}
security.bootstrap.member-username=${INITIAL_MEMBER_USERNAME:Member}
security.bootstrap.member-password=${INITIAL_MEMBER_PASSWORD:member7080}

# Managed-store provisioning. The backend never changes Kubernetes context implicitly.
stores.kubernetes.context=${KUBERNETES_CONTEXT:minikube}
stores.kubernetes.kubeconfig=${KUBECONFIG:}
stores.kubernetes.port-forward-address=${STORE_PORT_FORWARD_ADDRESS:127.0.0.1}
stores.kubernetes.kubectl-path=${KUBECTL_PATH:}
stores.kubernetes.helm-path=${HELM_PATH:}
stores.kubernetes.kubectl=${KUBECTL_EXECUTABLE:kubectl}
stores.kubernetes.helm=${HELM_EXECUTABLE:helm}
stores.helm.chart=${STORE_HELM_CHART:../helm/store-template}
