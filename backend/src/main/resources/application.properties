spring.application.name=backend
server.port=8081

#DB Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Kube-store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:avanish7080}
spring.jpa.hibernate.ddl-auto=update
