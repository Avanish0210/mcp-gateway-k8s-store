spring:
  ai:
    mcp:
      client:
        stdio:
          connections:
            woocommerce:
              command: ${MCP_NODE_COMMAND:node}
              args:
                - "${MCP_SERVER_PATH:${user.dir}/../mcp-servers/woocommerce/dist/server.js}"

        streamable-http:
          connections:
            github:
              url: ${GITHUB_MCP_URL:http://localhost:8082}
              endpoint: /mcp
