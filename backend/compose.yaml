services:
  backend:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8081"
      - "127.0.0.1:38081:38081"
      - "127.0.0.1:38082:38082"
      - "127.0.0.1:38083:38083"
    volumes:
      - ../.docker/kubeconfig:/home/app/.kube/config:ro
    env_file:
      - ../mcp-servers/woocommerce/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kube_store}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-avanish7080}
      SPRING_AI_MCP_CLIENT_ENABLED: ${SPRING_AI_MCP_CLIENT_ENABLED:-true}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in the root .env file or your environment}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m -XX:+UseSerialGC -XX:ActiveProcessorCount=2"
      GITHUB_MCP_URL: http://github-mcp:8082
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:?Set GITHUB_PERSONAL_ACCESS_TOKEN in the root .env file or your environment}
      # Supervised by the backend; independent of Minikube's published ports.
      WOOCOMMERCE_URL: http://127.0.0.1:38081
      DASHBOARD_ALLOWED_ORIGIN: ${DASHBOARD_ALLOWED_ORIGIN:-http://localhost:5173}
      KUBECONFIG: /home/app/.kube/config
      KUBERNETES_CONTEXT: ${KUBERNETES_CONTEXT:-minikube}
      KUBECTL_EXECUTABLE: kubectl
      HELM_EXECUTABLE: helm
      STORE_PORT_FORWARD_ADDRESS: 0.0.0.0
      # Bitnami Legacy WordPress is currently pinned at 6.8.2 for local
      # development, so keep the WooCommerce release compatible with it.
      STORES_WOOCOMMERCE_PLUGIN_VERSION: ${STORES_WOOCOMMERCE_PLUGIN_VERSION:-10.7.0}
      JWT_SECRET: ${JWT_SECRET:-jegfvjsdvcvsyvdyfgvsjdhvcdbfuguygsjgdvfjdsvcjhevfgdshfgdhfghfhsdvfhsvdfhsvhfveydvfsyvdfjhvsjhvfd}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      TEAM_INVITATION_EXPIRATION_HOURS: ${TEAM_INVITATION_EXPIRATION_HOURS:-72}
      TEAM_INVITATION_DEV_LINKS_ENABLED: ${TEAM_INVITATION_DEV_LINKS_ENABLED:-false}
      INVITATION_FRONTEND_BASE_URL: ${INVITATION_FRONTEND_BASE_URL:-http://localhost:5173}
      TEAM_INVITATION_EMAIL_ENABLED: ${TEAM_INVITATION_EMAIL_ENABLED:-false}
      TEAM_INVITATION_FROM: ${TEAM_INVITATION_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin7080}
      INITIAL_MEMBER_USERNAME: ${INITIAL_MEMBER_USERNAME:-Member}
      INITIAL_MEMBER_PASSWORD: ${INITIAL_MEMBER_PASSWORD:-member7080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      minikube-api:
        # Keep Docker from assigning Minikube's reserved .2 address to the
        # backend when containers auto-start before the cluster after reboot.
        ipv4_address: ${MINIKUBE_BACKEND_IP:-192.168.49.254}
    depends_on:
      db:
        condition: service_healthy
      github-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  github-mcp:
    restart: unless-stopped
    image: ghcr.io/github/github-mcp-server:latest
    command: ["http"]
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      GITHUB_READ_ONLY: "1"

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kube_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avanish7080}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  minikube-api:
    external: true
    name: ${KUBERNETES_CONTEXT:-minikube}
