services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8081"
      - "127.0.0.1:38082:38082"
      - "127.0.0.1:38083:38083"
    volumes:
      - ../.docker/kubeconfig:/home/app/.kube/config:ro
    env_file:
      - ../mcp-servers/woocommerce/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kube_store}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-avanish7080}
      SPRING_AI_MCP_CLIENT_ENABLED: ${SPRING_AI_MCP_CLIENT_ENABLED:-true}
      GITHUB_MCP_URL: http://github-mcp:8082
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:?Set GITHUB_PERSONAL_ACCESS_TOKEN in the root .env file or your environment}
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-http://host.docker.internal:8080}
      DASHBOARD_ALLOWED_ORIGIN: ${DASHBOARD_ALLOWED_ORIGIN:-http://localhost:5173}
      KUBECONFIG: /home/app/.kube/config
      KUBERNETES_CONTEXT: ${KUBERNETES_CONTEXT:-minikube}
      KUBECTL_EXECUTABLE: kubectl
      HELM_EXECUTABLE: helm
      STORE_PORT_FORWARD_ADDRESS: 0.0.0.0
      # Bitnami Legacy WordPress is currently pinned at 6.8.2 for local
      # development, so keep the WooCommerce release compatible with it.
      STORES_WOOCOMMERCE_PLUGIN_VERSION: ${STORES_WOOCOMMERCE_PLUGIN_VERSION:-10.7.0}
      JWT_SECRET: ${JWT_SECRET:-jegfvjsdvcvsyvdyfgvsjdhvcdbfuguygsjgdvfjdsvcjhevfgdshfgdhfghfhsdvfhsvdfhsvhfveydvfsyvdfjhvsjhvfd}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin7080}
      INITIAL_MEMBER_USERNAME: ${INITIAL_MEMBER_USERNAME:-Member}
      INITIAL_MEMBER_PASSWORD: ${INITIAL_MEMBER_PASSWORD:-member7080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      github-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    command: ["http"]
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      GITHUB_READ_ONLY: "1"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kube_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avanish7080}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
